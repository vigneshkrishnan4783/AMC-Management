allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21"
            force "org.jetbrains.kotlin:kotlin-reflect:2.0.21"
            force "androidx.core:core:1.13.1"
            force "androidx.core:core-ktx:1.13.1"
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { subproject ->
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            freeCompilerArgs += [
                "-Xskip-metadata-version-check"
            ]
        }
    }

    if (subproject.name != "app") {
        def flutterConfig = [
            compileSdkVersion: 35,
            minSdkVersion: 21,
            targetSdkVersion: 35,
            ndkVersion: "25.1.8937393"
        ]
        subproject.extensions.add("flutter", flutterConfig)
        subproject.ext.flutter = flutterConfig

        subproject.plugins.whenPluginAdded { plugin ->
            if (plugin.class.name.contains("Android")) {
                try {
                    subproject.android.extensions.add("flutter", flutterConfig)
                } catch (Exception ignored) {}
            }
        }

        subproject.afterEvaluate {
            if (subproject.hasProperty("android")) {
                try {
                    if (subproject.android.compileSdkVersion == null) {
                        subproject.android.compileSdkVersion = 35
                    }
                } catch (Exception ignored) {}
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
